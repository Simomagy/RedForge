[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Prysma Studio"]

[workspace.dependencies]
rf-formats = { path = "crates/rf-formats" }

[profile.dev]
# The RPF cipher and Kraken decompressor are unusably slow without optimisation.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
