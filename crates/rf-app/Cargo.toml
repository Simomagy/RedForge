[package]
name = "rf-app"
description = "RedForge: a map editor for RedM"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "redforge"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.36"
egui_dock = "0.21"
egui-phosphor = "0.14"
env_logger = "0.11.11"
glam = "0.34.2"
image = "0.25.10"
log = "0.4.35"
rf-formats.workspace = true
rf-render = { path = "../rf-render" }
rfd = "0.17"
tiny-skia = "0.11.4"
rf-game = { path = "../rf-game" }
rf-bridge = { path = "../rf-bridge" }
rf-editor = { path = "../rf-editor" }
rf-world = { path = "../rf-world" }
transform-gizmo-egui = "0.11"
mint = "0.5"

[target.'cfg(windows)'.dependencies]
# Where the launchers installed the game.
winreg = "0.56"

# File drops on Wayland (src/wayland_drop.rs), on winit's connection: the
# versions winit and egui already use.
[target.'cfg(target_os = "linux")'.dependencies]
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = { version = "0.31.15", features = ["system"] }

# The .deb (cargo-deb), from the binaries packaging/linux/build.sh makes.
[package.metadata.deb]
name = "redforge"
maintainer = "Prysma Studio <simomagy02@proton.me>"
copyright = "Prysma Studio"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
RedForge edits Red Dead Redemption 2's maps for RedM: the streamed world, its \
entities, interiors, instanced props and grass, the game's file formats and \
their XML, projects exported as RedM resources, and a bridge to Blender."""
section = "graphics"
priority = "optional"
depends = "libc6 (>= 2.31), libgcc-s1, libvulkan1"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/redforge", "usr/bin/", "755"],
    ["target/release/rf", "usr/bin/", "755"],
    ["../../data/rdr2/strings.txt", "usr/share/redforge/data/rdr2/", "644"],
    ["../../blender/redforge_bridge/__init__.py", "usr/share/redforge/blender/redforge_bridge/", "644"],
    ["../../blender/redforge_bridge/link.py", "usr/share/redforge/blender/redforge_bridge/", "644"],
    ["../../blender/redforge_bridge/blender_manifest.toml", "usr/share/redforge/blender/redforge_bridge/", "644"],
    ["../../packaging/linux/redforge.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/redforge-mime.xml", "usr/share/mime/packages/redforge.xml", "644"],
    ["../../packaging/linux/icons/redforge-16.png", "usr/share/icons/hicolor/16x16/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-24.png", "usr/share/icons/hicolor/24x24/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-32.png", "usr/share/icons/hicolor/32x32/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-48.png", "usr/share/icons/hicolor/48x48/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-64.png", "usr/share/icons/hicolor/64x64/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-96.png", "usr/share/icons/hicolor/96x96/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-128.png", "usr/share/icons/hicolor/128x128/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-256.png", "usr/share/icons/hicolor/256x256/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-512.png", "usr/share/icons/hicolor/512x512/apps/redforge.png", "644"],
    ["../../packaging/linux/icons/redforge-project-16.png", "usr/share/icons/hicolor/16x16/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-24.png", "usr/share/icons/hicolor/24x24/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-32.png", "usr/share/icons/hicolor/32x32/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-48.png", "usr/share/icons/hicolor/48x48/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-64.png", "usr/share/icons/hicolor/64x64/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-96.png", "usr/share/icons/hicolor/96x96/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-128.png", "usr/share/icons/hicolor/128x128/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-256.png", "usr/share/icons/hicolor/256x256/mimetypes/application-x-redforge-project.png", "644"],
    ["../../packaging/linux/icons/redforge-project-512.png", "usr/share/icons/hicolor/512x512/mimetypes/application-x-redforge-project.png", "644"],
    ["../../README.md", "usr/share/doc/redforge/", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/redforge/", "644"],
]
