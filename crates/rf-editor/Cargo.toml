[package]
name = "rf-editor"
description = "RedForge's editor: the map data being edited, the selection, undo and redo, and saving ymaps"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glam = "0.34.2"
# rerecast's own glam
flate2 = "1.1.10"
glam033 = { package = "glam", version = "0.33" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
log = "0.4.35"
rayon = "1.12.0"
rerecast = { version = "1.0.0", default-features = false, features = ["std"] }
rf-formats.workspace = true
rf-game = { path = "../rf-game" }
rf-world = { path = "../rf-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1.2"
ttf-parser = "0.25.1"

[dev-dependencies]
tempfile = "3"
