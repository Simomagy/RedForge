[package]
name = "rf-editor"
description = "RedForge's editor: the map data being edited, the selection, undo and redo, and saving ymaps"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glam = "0.34.2"
log = "0.4.35"
rf-formats.workspace = true
rf-game = { path = "../rf-game" }
rf-world = { path = "../rf-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
